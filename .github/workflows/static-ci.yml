name: Static App CI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'vercel.json'
      - 'README.md'
      - 'SUBMISSION_DRAFT.md'
      - 'HACKATHON_LEDGER.md'
      - '.github/workflows/static-ci.yml'

jobs:
  verify-static-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required files and wiring
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'id="analyzeBtn"' index.html
          grep -q "addEventListener('click',analyze)" app.js
      - name: No accidental secrets
        shell: bash
        run: |
          ! grep -REn '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' index.html styles.css app.js README.md SUBMISSION_DRAFT.md HACKATHON_LEDGER.md
